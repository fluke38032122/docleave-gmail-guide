<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>เลือกคู่มือที่ต้องการ</title>
<style>
:root{font-family:system-ui,-apple-system,"Thonburi",sans-serif;color:#183e37;background:#f4f7f5;line-height:1.75}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:0 auto;padding:24px 20px}.languages{display:flex;gap:8px;margin-bottom:32px}button{font:inherit;cursor:pointer;border:1px solid #b5cbc3;border-radius:12px;padding:10px 17px;background:white;color:#214d42;min-height:44px}.languages button[aria-pressed=true]{background:#f3d395;color:#243d32}button:focus-visible,a:focus-visible{outline:3px solid #db9309;outline-offset:3px}p{margin:0 0 18px}.choices{display:grid;gap:16px}a{display:flex;align-items:center;justify-content:center;min-height:96px;padding:20px 16px;background:#2c6855;color:white;border-radius:18px;text-align:center;text-decoration:none;font-size:21px;font-weight:650;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="languages" aria-label="Language"><button id="th" aria-pressed="true">ไทย</button><button id="en" aria-pressed="false">English</button></div>
<p id="prompt">เลือกคู่มือที่ต้องการ</p>
<div class="choices"><a id="gmail" href="gmail/">สร้าง Gmail</a><a id="signup" href="signup/">สมัคร DocLeave</a></div>
</main>
<script>
function render(lang){const th=lang==='th';document.documentElement.lang=lang;document.title=th?'เลือกคู่มือที่ต้องการ':'Choose a guide';document.getElementById('prompt').textContent=document.title;document.getElementById('gmail').textContent=th?'สร้าง Gmail':'Create a Gmail account';document.getElementById('signup').textContent=th?'สมัคร DocLeave':'Sign up for DocLeave';document.getElementById('th').setAttribute('aria-pressed',th);document.getElementById('en').setAttribute('aria-pressed',!th)}
document.getElementById('th').onclick=()=>render('th');document.getElementById('en').onclick=()=>render('en');
</script>
</body>
</html>
